[pytest]
testpaths = tests
# Worktree isolation fix (SYMBOL360 plan): the shared venv's editable installs
# of ba2_common/ba2_providers/ba2_experts (.venv/Lib/site-packages/_editable_impl_*.pth)
# point at the MAIN checkout by absolute path, not this worktree. Without this,
# a plain `pytest` run here silently resolves those packages against the main
# worktree's code -- either ModuleNotFoundError for anything new, or a stale
# copy for anything edited. Prepending this worktree's own packages/* makes
# `pytest` (but not `python main.py` -- that still needs an explicit
# PYTHONPATH) always exercise the code actually in this worktree.
pythonpath = packages/common packages/providers packages/experts
python_files = test_*.py
python_classes = Test*
python_functions = test_*
markers =
    slow: marks tests as slow (deselect with '-m "not slow"')
addopts = -v --tb=short
