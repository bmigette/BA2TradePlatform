# Drop into /etc/fail2ban/jail.d/. Adjust logpath to this worker's actual LOGS_DIR
# (ba2_common.logger.LOGS_DIR / --log-folder) -- worker_server.log is written by
# _install_orchestration_file_logging() in app/worker_server.py, rotating at 10MB x 7 backups.
#
# Tune bantime/findtime/maxretry to taste. The worker is bearer-password-gated regardless of
# fail2ban -- this is defense in depth against brute-force/scan noise on a box reachable from
# the internet, not the only line of defence.

[ba2-worker]
enabled  = true
filter   = ba2-worker
logpath  = /path/to/worker/logs/worker_server.log
port     = 8100
protocol = tcp
maxretry = 5
findtime = 10m
bantime  = 1h
