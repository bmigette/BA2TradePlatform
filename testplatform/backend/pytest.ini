[pytest]
# Same worktree-isolation fix as the root pytest.ini: the shared venv's editable installs
# point at the MAIN checkout by absolute path, so without this a worktree's backend tests
# silently exercise the main checkout's ba2_common/ba2_providers/ba2_experts.
#
# ``..`` (testplatform/) is here for the same reason, for ``ba2test_launcher``: the
# ba2test_app editable install maps it to the MAIN checkout, and importing THAT one puts
# the main ``testplatform/backend`` on sys.path, after which every ``app.*`` import comes
# from there too -- measured, as a worktree's tests/replay failing against a stale
# gather_tape whenever tests/backtest was collected in the same run.
#
# The repo ROOT is deliberately NOT listed (it would give ``ba2_trade_platform`` the same
# way): it holds a ``tests/__init__.py``, i.e. a REGULAR package named exactly like this
# suite's own, and a pythonpath entry ahead of the working directory can shadow
# ``tests.replay``. The live tree is pinned in tests/backtest/conftest.py instead, which
# APPENDS the checkout root and then verifies what it got.
pythonpath = ../../packages/common ../../packages/providers ../../packages/experts ..
markers =
    slow: marks tests as slow (deselect with '-m "not slow"')
