[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ba2-mcp"
version = "2026.11.00001"
description = "MCP server for the BA2 Trade Platform management API (a thin HTTP client of /api/v1)"
requires-python = ">=3.10"
dependencies = ["mcp>=1.2", "httpx>=0.27"]

[project.scripts]
ba2-mcp = "ba2_mcp.server:main"

[tool.setuptools]
packages = ["ba2_mcp"]
