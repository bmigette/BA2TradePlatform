name: parity-and-coverage

# Continuous live<->backtest PARITY GATE (Phase 5 of the engine-unification plan) + a coverage
# artifact for the shared decision path. The golden parity test replays recorded live decisions
# through the backtest engine and asserts decision identity; wiring it here makes any change that
# breaks live<->backtest parity fail the build.
#
# IMPORTANT: this installs ba2_common/ba2_providers/ba2_experts from the MONOREPO (packages/*),
# NOT the stale sibling repos that testplatform/backend/requirements.txt lines 6-8 reference. The
# canonical-import guard step fails fast if the wrong tree ever gets installed.

on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [dev, main]

jobs:
  parity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install monorepo packages (canonical, not the stale siblings)
        run: |
          python -m pip install --upgrade pip
          pip install -e packages/common -e packages/providers -e packages/experts
          # Backend runtime deps EXCEPT the stale-sibling editable installs (lines that point at
          # ../../BA2Trade*): those are replaced by the packages/* installs above.
          grep -vE '^\s*-e\s+\.\./\.\./BA2Trade' testplatform/backend/requirements.txt > /tmp/be-reqs.txt || true
          pip install -r /tmp/be-reqs.txt
          # pytest-github-actions-annotate-failures turns every failure into a ::error::
          # annotation. That matters for more than tidiness: downloading a run's LOGS needs
          # ADMIN rights on the repo and returns 403 otherwise, while the annotations API is
          # readable by anyone who can see this public repo. Without it a red build is a bare
          # "Process completed with exit code 1" to everybody but the owner.
          pip install pytest pytest-cov coverage pytest-github-actions-annotate-failures

      - name: Record the resolved dependency set (nothing is pinned, so it drifts)
        # Every one of the 54 backend requirements is declared '>=', so each run resolves
        # whatever is newest. A build can therefore go from green to red with NO commit,
        # which is exactly what happened on 2026-09-21 (green faf553a6 21:23Z -> red on a
        # one-line docs change 22:07Z). Freezing the resolution makes the next such shift a
        # diff instead of a mystery.
        run: pip freeze > pip-freeze.txt && cat pip-freeze.txt

      - name: Guard — ba2_common resolves to the monorepo (not the stale sibling)
        run: |
          python -c "import ba2_common, os; p = os.path.realpath(ba2_common.__file__); assert 'packages/common' in p, p; print('canonical ba2_common:', p)"

      - name: PARITY GATE — golden live↔backtest decision identity (blocking)
        working-directory: testplatform/backend
        # test_golden_fixture_is_committed asserts (not skips) when the committed fixture is missing,
        # and the parity tests carry no skipif — so a broken/missing fixture FAILS here (non-zero exit
        # fails the job). No junit skip-parsing needed.
        #
        # test_margin_live_backtest_parity.py is the three-way BT / $4k-1x / $2k-2x sizing gate. It
        # carries two STRICT xfails for the deliberately deferred blockers (finding 6: the backtest
        # get_balance() cash-vs-equity contract; finding 4: the classic per-instrument ceiling
        # denominator). Strict means an XPASS FAILS this gate on purpose: either blocker becoming
        # true silently would move historical backtest numbers, so it must be a separately
        # versioned, reviewed correction rather than a quiet green build.
        run: python -m pytest tests/backtest/test_parity_golden.py tests/backtest/test_margin_live_backtest_parity.py -v -p no:cacheprovider

      - name: Backtest engine + shared decision suite (blocking)
        working-directory: testplatform/backend
        # -rA prints a reason line for every outcome and --junitxml is uploaded below, so a
        # failure is diagnosable from the artifact alone when the log is not readable.
        run: python -m pytest tests/backtest -q -rA --junitxml=junit-backtest.xml

      - name: Surface the failure tracebacks as annotations
        # Runs ONLY on failure. See .github/scripts/annotate_junit_failures.py for why this is
        # the only channel a non-admin can read.
        if: failure()
        working-directory: testplatform/backend
        run: python "$GITHUB_WORKSPACE/.github/scripts/annotate_junit_failures.py" junit-backtest.xml
      - name: Shared decision-path branch coverage (artifact, non-blocking)
        working-directory: testplatform/backend
        continue-on-error: true
        run: |
          python -m pytest tests/backtest \
            --cov=ba2_common.core.TradeActionEvaluator \
            --cov=ba2_common.core.TradeActions \
            --cov=ba2_common.core.TradeConditions \
            --cov=ba2_common.core.TradeRiskManagement \
            --cov=ba2_common.core.position_sizing \
            --cov-branch --cov-report=xml:coverage-decision.xml --cov-report=term-missing

      - name: Upload coverage artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-decision
          path: testplatform/backend/coverage-decision.xml
          if-no-files-found: ignore

      - name: Upload failure diagnostics (junit + the resolved dependency set)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: failure-diagnostics
          path: |
            testplatform/backend/junit-backtest.xml
            pip-freeze.txt
          if-no-files-found: ignore
