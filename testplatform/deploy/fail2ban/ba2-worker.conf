# fail2ban filter for the BA2 remote worker server (app/worker_server.py).
#
# Every endpoint is bearer-checked (see worker_server.py's _verify); any failure -- missing
# header, malformed header, or a wrong password -- logs one WARNING line naming the source IP
# BEFORE the request is rejected, in this fixed format:
#
#   auth failed from <ip>: missing Authorization header
#   auth failed from <ip>: malformed Authorization header
#   auth failed from <ip>: invalid worker password
#
# The submitted token/password is NEVER logged, so this file is safe to read even if it later
# ends up somewhere less trusted than the worker box itself.
#
# Install:
#   sudo cp ba2-worker.conf /etc/fail2ban/filter.d/ba2-worker.conf
#   sudo cp ba2-worker.jail.conf /etc/fail2ban/jail.d/ba2-worker.conf
#   # edit the jail's logpath to match this worker's actual LOGS_DIR (see
#   # ba2_common.logger.LOGS_DIR / --log-folder), then:
#   sudo systemctl restart fail2ban
#   sudo fail2ban-client status ba2-worker

[Definition]
failregex = ^.* - app\.worker_server - WARNING - auth failed from <HOST>:
ignoreregex =
